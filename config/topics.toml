# 매일 수집할 뉴스 주제와 검색어
# 검색어를 추가하거나 빼서 원하는 대로 바꿀 수 있어요.
# OR 를 쓰면 둘 중 하나라도 들어간 기사를 찾습니다.

[news]
# 최근 며칠 치 기사를 가져올지
lookback_days = 1
# 검색어 하나당 가져올 최대 기사 수 (최신순)
max_per_query = 30

[[topics]]
name = "이차전지"
queries = ["이차전지", "전고체 배터리", "양극재 OR 음극재"]

[[topics]]
name = "반도체"
queries = ["반도체", "HBM", "파운드리 OR 반도체 공정"]
